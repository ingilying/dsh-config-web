name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The range DeepSeek Harness itself supports; the fetch stack's undici
        # needs a modern Web IDL implementation, so 20 cannot run these tests.
        node: ['22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `continue-on-error` keeps the run going long enough to turn each failed
      # test into an annotation, which is what shows up on the pull request
      # without opening the raw log.
      - name: Run tests
        id: test
        continue-on-error: true
        shell: bash
        run: pnpm test 2>&1 | tee vitest.log

      - name: Annotate test failures
        if: steps.test.outcome == 'failure'
        shell: bash
        run: |
          grep -E "FAIL |AssertionError|Error: |Tests +[0-9]+ failed" vitest.log | head -30 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | head -c 400)"
          done

      - name: Fail when the tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Run the installer CLI
        run: |
          node bin/install.mjs --help
          node bin/install.mjs --version

      - name: Run the shell entry point
        if: runner.os != 'Windows'
        run: ./install.sh --version

  install:
    name: install path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install this checkout into a throwaway profile
        run: node scripts/smoke-install.mjs

      - name: Install through the repository fallback, the way npx does before a publish
        run: node scripts/smoke-install.mjs --from-git

      - name: Pack what npm would publish
        run: pnpm pack --pack-destination dist

      - name: Install the packed tarball into a throwaway profile
        run: node scripts/smoke-install.mjs --source dist/*.tgz
