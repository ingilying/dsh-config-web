name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20 is the oldest release the installer and the bundle support; 26 is
        # the newest line the harness runs on.
        node: ['20', '22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run the installer CLI
        run: |
          node bin/install.mjs --help
          node bin/install.mjs --version

      - name: Run the shell entry point
        if: runner.os != 'Windows'
        run: ./install.sh --version

  install:
    name: install path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install this checkout into a throwaway profile
        run: node scripts/smoke-install.mjs

      - name: Install through the repository fallback, the way npx does before a publish
        run: node scripts/smoke-install.mjs --from-git

      - name: Pack what npm would publish
        run: pnpm pack --pack-destination dist

      - name: Install the packed tarball into a throwaway profile
        run: node scripts/smoke-install.mjs --source dist/*.tgz
